# Stack lokalny/deweloperski cortex-next. Cel docelowy: `docker compose up`
# stawia całe środowisko (docs/infrastructure.md).
#
# Zakres TEGO pliku (Ścieżka E): Postgres + cortex-frontend.
# Caddy, oauth2-proxy, Keycloak i chat/OpenWebUI są POZA zakresem — lokalnie
# auth idzie przez DEV_USER_EMAIL, nie przez pełny łańcuch SSO.
#
# Plik produkcyjny (gotowy image z GHCR) to docker-compose.image.yml — ten
# służy do developmentu i buduje obraz lokalnie.

services:
  postgres:
    image: postgres:16-alpine
    # NIE "cortex-postgres" — ta nazwa należy do stacku ~/REPO/cortex-admin
    # (postgres:15, dane źródłowe do migracji). Kolizja nazw kontenerów
    # zablokowałaby start albo skusiła do skasowania cudzych danych.
    container_name: cortex-next-postgres
    restart: unless-stopped
    environment:
      # UWAGA: wartości domyślne są WYŁĄCZNIE do lokalnego developmentu.
      # W realnym środowisku podstawiane z sekretów, nigdy z tego pliku.
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cortex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # KROK WDROŻENIOWY, nie usługa: stosuje migracje, rejestruje aplikacje
  # i uzgadnia konto ADMIN_EMAIL, po czym KOŃCZY się. cortex-frontend startuje
  # dopiero po jego powodzeniu (service_completed_successfully).
  #
  # Dlaczego to musi istnieć: powłoka czyta uprawnienia z tego Postgresa
  # (GET /api/me/access), a bramka jest fail-closed. Kontener wstający na
  # pustej bazie = zero grantów dla wszystkich, w tym dla panelu Konfiguracji
  # Systemu, którym dałoby się to naprawić — czyli dokładnie ten stan, który
  # ta zmiana usuwa, tylko z innego powodu. Do 30.07.2026 nic tych kroków nie
  # uruchamiało; było to niewidoczne wyłącznie dlatego, że powłoka nie dotykała
  # bazy.
  #
  # Ten sam obraz co aplikacja — migracje i seed mają jechać z dokładnie tego
  # kodu, który zaraz wstanie, nie z checkoutu na maszynie operatora.
  #
  # KOLEJNOŚĆ SEEDÓW JEST ZNACZĄCA: seed-tile-manifests.mjs musi wyprzedzać
  # seed-system-config.mjs — rejestruje (nieaktywne) wiersze applications dla
  # WSZYSTKICH kafelków natywnych opisanych manifestem (@cortex/tile-sdk
  # defineTile(), PROJECT/cortex-frontend-hub-db-driven-projekt.md D10-rewizja
  # c/d), żeby blok grantowania admina w seed-system-config.mjs ("wszystkie
  # wiersze w applications") objął też świeżo zarejestrowane, choć jeszcze
  # nieaktywowane, kody. seed-system-config.mjs zakłada rolę `admin`, a seedy
  # modułowe (ilustromat, token-usage) nadają jej granty. Uruchomione przed
  # nim nie mają czego grantować i od 30.07.2026 kończą się BŁĘDEM (wcześniej:
  # log i exit 0 — kafelek rejestrował się bez dostępu dla kogokolwiek).
  # Każdy nowy kafelek z własnym seedem dopisujemy TUTAJ, na koniec łańcucha —
  # inaczej jest zarejestrowany w kodzie i niewidoczny na wdrożonym środowisku.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-next-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:-cortex}@postgres:5432/${POSTGRES_DB:-cortex}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    command:
      - sh
      - -c
      - >-
        node packages/@cortex/db/scripts/migrate.mjs &&
        node packages/@cortex/db/scripts/seed-tile-manifests.mjs &&
        node packages/@cortex/db/scripts/seed-system-config.mjs &&
        node packages/@cortex/db/scripts/seed-ilustromat.mjs &&
        node packages/@cortex/db/scripts/seed-token-usage.mjs
    security_opt:
      - no-new-privileges:true

  cortex-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-frontend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "80"
      HOSTNAME: 0.0.0.0
      # Jedna baza, schema-per-moduł — moduły NIE dostają osobnych baz.
      DATABASE_URL: postgres://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:-cortex}@postgres:5432/${POSTGRES_DB:-cortex}
      # cortex-proxy żyje POZA tym stackiem (osobny, wielo-konsumencki serwis —
      # docs/database.md). Lokalnie: cd ~/REPO/cortex-proxy && docker compose up -d
      # wystawia go na 8240 hosta.
      CORTEX_PROXY_URL: ${CORTEX_PROXY_URL:-http://host.docker.internal:8240}
      # Pusty = brak nagłówka Authorization. NIE wpisywać tu prawdziwego klucza.
      CORTEX_PROXY_API_KEY: ${CORTEX_PROXY_API_KEY:-}
      # INNY SEKRET niż powyższy — kafelek "Raportowanie Tokenów" (GET /usage).
      # CORTEX_PROXY_API_KEY idzie jako "Authorization: Bearer" do
      # /v1/chat/completions i proxy i tak nadpisuje go kluczem upstreamu;
      # ten tutaj idzie jako "X-Admin-API-Key" i jest sprawdzany przeciwko
      # ADMIN_API_KEY w env cortex-proxy. Pomylenie ich daje ciche 401.
      # Puste = kafelek zwraca 503, reszta aplikacji działa normalnie.
      CORTEX_PROXY_ADMIN_API_KEY: ${CORTEX_PROXY_ADMIN_API_KEY:-}
      # Administrator instancji, deklaratywnie — patrz packages/@cortex/db db:seed.
      # Usunięcie tej zmiennej odbiera kontu automatyczne przywracanie dostępu.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Ilustromat — modele konfigurowalne per instancja klienta. Puste =
      # domyślne z app/idp/lib/ilustromat/config.ts, nie awaria.
      ILUSTROMAT_TEXT_MODEL: ${ILUSTROMAT_TEXT_MODEL:-}
      ILUSTROMAT_IMAGE_MODEL: ${ILUSTROMAT_IMAGE_MODEL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Content-free proof-of-concept, NIE realny backend — dowodzi, że Python
  # w ogóle daje się zbudować/uruchomić/dosięgnąć w tym compose (patrz
  # .claude/skills/code-python-service/SKILL.md). Realne serwisy
  # (geo-score-calculator, document-parser) kopiują ten wzorzec i wchodzą
  # do `services:` BEZ profilu — startują domyślnie z `docker compose up`,
  # bo cortex-frontend realnie ich potrzebuje. Ten tutaj zostaje za
  # profilem, żeby nie budować/uruchamiać balastu przy każdym zwykłym
  # `docker compose up`: `docker compose --profile python-template up`.
  template-python-service:
    profiles: ["python-template"]
    build:
      context: services/_template-python-service
    container_name: cortex-next-template-python-service
    restart: unless-stopped
    # BRAK ports: — osiągalny WYŁĄCZNIE przez Docker DNS z innych
    # kontenerów tej sieci (tu: http://template-python-service:8000),
    # nigdy z hosta. To jest posturę bezpieczeństwa opisaną w obu design
    # dokach (GEO Score D3, Parser Dokumentów D6) — zweryfikowana realnym
    # `curl` z hosta (fail) i z sąsiedniego kontenera (pass), nie założona.
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

# TODO(cortex-next): gdy cortex-proxy ma stać w TYM stacku, nie obok — dociągnąć
# jego własny compose przez include:, nie kopiować definicji tutaj
# (.claude/skills/code-compose/SKILL.md). Wymaga sklonowanego repo obok:
#
# include:
#   - path: ../cortex-proxy/docker-compose.yml
#     project_directory: ../cortex-proxy
#
# Sekrety cortex-proxy (OPENROUTER_API_KEY itd.) zostają w .env TAMTEGO repo.

volumes:
  cortex_postgres_data:
