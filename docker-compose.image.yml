services:
  # Baza TEGO stacku. Do 07.08.2026 nie było jej tutaj wcale: DATABASE_URL
  # występował wyłącznie w komentarzu, a plik zakładał bazę „gdzieś obok" —
  # której nic nie stawia (zero wzmianek o postgresie w devops/playbooks/).
  # Po otagowaniu `cortex-next` skutkowałoby to `migrate` przerywanym z
  # „DATABASE_URL nie jest ustawione" i aplikacją, która w ogóle nie wstaje
  # przez depends_on: service_completed_successfully.
  #
  # BRAK `ports:` — CELOWO, w przeciwieństwie do docker-compose.yml, który
  # publikuje ${POSTGRES_PORT:-5432}:5432 dla wygody lokalnego klienta SQL.
  # Tu leży cały system_config: użytkownicy, role, granty, rejestr kafelków.
  # Zweryfikowane 07.08.2026 na cortex-next: opublikowany port był osiągalny
  # (`nc`) z każdego węzła ZeroTier, a lokalny `ufw` tego NIE zasłania — Docker
  # wpina reguły w łańcuch DOCKER przed regułami ufw. Dostęp administracyjny
  # idzie przez `docker exec cortex-frontend-postgres<TAG> psql -U cortex`.
  postgres:
    image: postgres:16-alpine
    # ${ENVIRONMENT_TAG} dokładnie tak samo jak w obu usługach niżej: na jednym
    # hoście stoją równolegle instancja produkcyjna i UAT (devops:
    # deploy-cortex-frontend.yml vs deploy-cortex-frontend-uat.yml, które
    # wstawia ENVIRONMENT_TAG=UAT do .env). Bez tagu obie wskazywałyby jeden
    # kontener i JEDNĄ bazę. Nazwa jest też unikalna w skali hosta:
    # `cortex-postgres` należy do stacku cortex-admin, `idp_postgres<TAG>` do
    # stacku idp, a `cortex-next-postgres` do docker-compose.yml.
    container_name: cortex-frontend-postgres${ENVIRONMENT_TAG}
    restart: unless-stopped
    environment:
      # BEZ wartości domyślnej, w przeciwieństwie do docker-compose.yml, gdzie
      # `cortex/cortex` jest jawnie opisane jako WYŁĄCZNIE lokalne. Ten plik
      # jedzie na instancje klienckie, a sieć `run_default` jest współdzielona
      # (Caddy, oauth2-proxy, cortex-proxy, chat, idp...) — brak `ports:` chroni
      # przed hostem i siecią ZeroTier, ale NIE przed sąsiednim kontenerem.
      # Hasło jest tam jedyną granicą, więc nie może pochodzić z pliku w gicie.
      #
      # `:?` a nie `?`: puste POSTGRES_PASSWORD jest GORSZE niż nieustawione —
      # obraz postgres odmawia wtedy startu, dopóki ktoś nie doda
      # POSTGRES_HOST_AUTH_METHOD=trust, czyli bazy przyjmującej dowolne hasło.
      # Compose przerywa z tym komunikatem, zanim cokolwiek wstanie.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env — docker-compose.image.yml nie ma domyslnego hasla}"
      # Nazwa użytkownika i bazy to nie sekrety. Domyślki są te same co w
      # docker-compose.yml i trzymają DATABASE_URL niżej deterministycznym.
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - cortex_frontend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # Krok wdrożeniowy uruchamiany PRZED aplikacją i kończący się (patrz
  # docker-compose.yml, ta sama usługa z komentarzem "dlaczego"). Powłoka czyta
  # uprawnienia z Postgresa i jest fail-closed, więc deploy na bazę bez migracji
  # i bez rejestru aplikacji odcina wszystkich, łącznie z panelem, którym dałoby
  # się to naprawić. DATABASE_URL i ADMIN_EMAIL przychodzą z .env środowiska.
  #
  # Łańcuch seedów musi być IDENTYCZNY z docker-compose.yml — te dwa pliki
  # rozjeżdżające się po cichu to dokładnie ten błąd, przez który kafelek
  # token-usage był martwy po `docker compose up` do 30.07.2026.
  # seed-tile-manifests.mjs PRZED seed-system-config.mjs — patrz komentarz w
  # docker-compose.yml (ta sama usługa).
  migrate:
    # WŁASNY obraz tego repo, nie odziedziczony po cortex-frontend. Plik przyszedł
    # tu razem z kodem i przez jakiś czas ciągnął obrazy poprzednika — co znaczyło,
    # że wdrożenie „Cortex Next" dostawało build INNEGO repo, a zmiany scalone tutaj
    # nie docierały do klienta wcale. Nazwy kontenerów i wolumenów zostają
    # `cortex-frontend*` CELOWO: to są identyfikatory istniejących danych i wpisów
    # w playbookach devops, a przemianowanie wolumenu znaczy `migrate` na czystej
    # bazie i utratę kont, ról i grantów.
    #
    # WARUNEK KONIECZNY: obrazy pod tą nazwą powstają dopiero po wypchnięciu tagu
    # `v*` w PANADEO/cortex-next (.github/workflows/docker-build.yml). Do tego czasu
    # `ghcr.io/panadeo/cortex-next` NIE ISTNIEJE i wdrożenie z tego pliku nie wstanie.
    #
    # DLACZEGO `:?`, A NIE DOMYŚLNY `latest`. Ten workflow publikuje `latest` WYŁĄCZNIE
    # przy budowie z gałęzi `main` (`enable: github.ref == 'refs/heads/main'`), a odpala
    # się na `push: tags: v*`. Budowa z tagu NIGDY nie dostaje więc `latest` — i domyślka
    # `${IMAGE_TAG:-latest}` kazałaby wdrożeniu ciągnąć tag, którego nikt nie publikuje.
    # Awaria wyszłaby dopiero na serwerze, jako „manifest unknown", i to dla wszystkich
    # czterech obrazów naraz. `:?` zatrzymuje to w `docker compose config`, czytelnym
    # zdaniem, zanim ktokolwiek dotknie hosta. Ta sama postawa co przy POSTGRES_PASSWORD.
    image: ghcr.io/panadeo/cortex-next:${IMAGE_TAG:?ustaw IMAGE_TAG w .env — obrazy tego repo NIE MAJA tagu `latest`, patrz komentarz przy usludze migrate}
    container_name: cortex-frontend-migrate${ENVIRONMENT_TAG}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # `environment:` WYGRYWA z `env_file:` wyżej, więc wpisanie tu gotowego
      # adresu odcięłoby możliwość nadpisania go z .env. Stąd interpolacja:
      # Compose czyta .env środowiska także po to, żeby rozwinąć ${...} (tak
      # samo działa IMAGE_TAG i ENVIRONMENT_TAG), więc DATABASE_URL w .env
      # nadal wygrywa, a domyślka celuje w usługę `postgres` wyżej.
      #
      # `:-` a nie `-` (odwrotnie niż DEV_USER_EMAIL w docker-compose.yml):
      # tam puste `DEV_USER_EMAIL=` to świadomy WYŁĄCZNIK fallbacku tożsamości,
      # więc domyślka nie może się dla niego podstawiać. Tutaj pusty adres bazy
      # nie znaczy nic — nie ma trybu „bez bazy", powłoka jest fail-closed —
      # i dawałby dokładnie ten błąd, który ta usługa ma usunąć. Puste = tak
      # samo jak nieustawione: baza z tego stacku.
      #
      # Host to NAZWA KONTENERA, nie alias usługi `postgres`. Sieć run_default
      # jest współdzielona, a idp/docker-compose.image.yml ma na niej własną
      # usługę o nazwie `postgres` — bare `postgres:5432` byłoby tam nazwą
      # dwuznaczną (round-robin DNS między dwiema różnymi bazami). Dokładnie
      # dlatego idp adresuje swoją przez `idp_postgres${ENVIRONMENT_TAG}`.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@cortex-frontend-postgres${ENVIRONMENT_TAG}:5432/${POSTGRES_DB:-cortex}}
    command:
      - sh
      - -c
      - >-
        node packages/@cortex/db/scripts/migrate.mjs &&
        node packages/@cortex/db/scripts/seed-tile-manifests.mjs &&
        node packages/@cortex/db/scripts/seed-system-config.mjs &&
        node packages/@cortex/db/scripts/seed-ilustromat.mjs &&
        node packages/@cortex/db/scripts/seed-token-usage.mjs &&
        node packages/@cortex/db/scripts/seed-geo-score-calculator.mjs &&
        node packages/@cortex/db/scripts/seed-content-guru.mjs &&
        node packages/@cortex/db/scripts/seed-application-translations.mjs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  cortex-frontend:
    image: ghcr.io/panadeo/cortex-next:${IMAGE_TAG:?ustaw IMAGE_TAG w .env — obrazy tego repo NIE MAJA tagu `latest`, patrz komentarz przy usludze migrate}
    container_name: cortex-frontend${ENVIRONMENT_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Ta sama wartość i to samo uzasadnienie co przy usłudze `migrate` wyżej
      # (precedencja environment/env_file, `:-`, adresowanie po nazwie
      # kontenera). Musi być IDENTYCZNA — migracje i aplikacja czytają jedną bazę.
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@cortex-frontend-postgres${ENVIRONMENT_TAG}:5432/${POSTGRES_DB:-cortex}}
      # Katalog plików Biurka. MUSI wskazywać na wolumen niżej — bez tej zmiennej
      # `desk-storage.ts` domyśla się `./.data` w warstwie zapisywalnej kontenera,
      # czyli w miejscu, które znika przy każdym `docker compose up` nowego obrazu.
      - DESK_DATA_DIR=/data/desk
      # PIASKOWNICA KODU — włączana świadomie, nie domyślnie. Puste znaczy „demona nie ma"
      # i wtedy obliczenia biegną ścieżką zastępczą z OTWARTĄ SIECIĄ. Ustawienie tego BEZ
      # postawionego demona jest gorsze niż brak: każda tura z obliczeniem padnie na
      # połączeniu. Demon stawia się na hoście — patrz repozytorium cortex-sandbox.
      - DESK_SANDBOX_SOCKET=${DESK_SANDBOX_SOCKET:-}
      # Kto może być serwerem MCP. Domyślnie `mcp-*`, czyli usługi nazwane tak w tym
      # samym compose — adres PRYWATNY z definicji i to jest przypadek poprawny, więc
      # reguła nie brzmi „tylko adresy publiczne". Bez tej listy przełożony wpisujący
      # `http://127.0.0.1:5432` kazałby kontenerowi Biurka tam pójść.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      # Adres Parsera Dokumentów. Dwaj odbiorcy tej jednej usługi: kafelek Parsera
      # (app/idp/lib/document-parser) i czynność `read_document` Biurka
      # (packages/@cortex/desk-core/src/document-parser.ts). Bez tej linii adres
      # musiałby przyjść z .env, a gdy go tam nie ma — nie ma go wcale i OBAJ
      # odbijają się w pustkę. Domyślka celuje w usługę niżej, z ${ENVIRONMENT_TAG},
      # żeby UAT nie chodził do parsera produkcji.
      - DOCUMENT_PARSER_BACKEND_URL=${DOCUMENT_PARSER_BACKEND_URL:-http://document-parser-backend${ENVIRONMENT_TAG}:8000}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=80
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:80/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    volumes:
      - cortex_frontend_ai_tools_history:/data/ai-tools-history
      - cortex_frontend_cowork_data:/app/app/idp/.data/cortex-cowork
      - cortex_frontend_okna_czasowe_data:/app/app/idp/.data/okna-czasowe
      # Pliki Biurka: „Moje pliki", teczki spraw i kosz. Do 02.09.2026 tego
      # wolumenu NIE BYŁO, a `desk-storage.ts` domyśla się `./.data` — czyli
      # dokumenty klienta leżały w efemerycznym systemie plików kontenera
      # i KAŻDE wdrożenie nowego obrazu je kasowało. Baza przeżywała, dysk nie,
      # więc po wdrożeniu zostawały sprawy opisujące pliki, których już nie ma —
      # a dowód pracy jest rozdzielony między jedno i drugie.
      - cortex_frontend_desk_data:/data/desk
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # ── Parser Dokumentów ──────────────────────────────────────────────────────
  # Do 02.09.2026 tych dwóch usług NIE BYŁO w tym pliku, choć w docker-compose.yml
  # stoją od początku. Skutek widoczny WYŁĄCZNIE na wdrożeniu: lokalnie czytanie
  # PDF-ów działa i ma zielone testy, a u klienta czynność `read_document` Biurka
  # i kafelek Parsera odbijają się od adresu, pod którym nic nie stoi. Dokładnie ta
  # klasa defektu, przed którą ostrzega .claude/skills/code-compose („rozjazd między
  # dwoma plikami compose jest cichy") — i w tym repo już trzeci raz.
  document-parser-backend:
    image: ghcr.io/panadeo/cortex-next/services/document-parser:${IMAGE_TAG:?ustaw IMAGE_TAG w .env — obrazy tego repo NIE MAJA tagu `latest`, patrz komentarz przy usludze migrate}
    container_name: document-parser-backend${ENVIRONMENT_TAG}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sidecar adresowany po NAZWIE KONTENERA z ${ENVIRONMENT_TAG}, nie po nazwie
      # usługi: sieć jest wspólna i zewnętrzna (`external: true` niżej), więc na
      # jednym hoście stoją obok siebie produkcja i UAT. Bez tagu backend UAT-u
      # trafiłby do unoservera produkcji — cicho i tylko czasem.
      - UNO_HOST=document-parser-unoserver${ENVIRONMENT_TAG}
      - UNO_PORT=2003
      - CORTEX_PROXY_URL=${CORTEX_PROXY_URL:-http://host.docker.internal:8240}
      - CORTEX_PROXY_API_KEY=${CORTEX_PROXY_API_KEY:-}
      # Bez wartości domyślnej — fail-closed, tak samo jak w docker-compose.yml
      # (Q3 design docu). Puste = /health mówi „ok", a pierwsze wywołanie modelu
      # pada czytelnym DependencyError. Instancja, która ma czytać PDF-y, MUSI to
      # ustawić razem z kluczem wyżej; zweryfikowana wartość stoi w .env.example.
      - DOCUMENT_PARSER_VISION_MODEL=${DOCUMENT_PARSER_VISION_MODEL:-}
    depends_on:
      document-parser-unoserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # BRAK `ports:` — CELOWO, dokładnie jak w docker-compose.yml (D6). Osiągalny
    # wyłącznie po Docker DNS z kontenera powłoki.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=512m

  # LibreOffice headless — sidecar konwersji formatów biurowych do PDF, zanim
  # model wizyjny w ogóle zobaczy stronę. Bez niego backend wstaje, ale każdy
  # DOCX i XLSX kończy się błędem zależności.
  document-parser-unoserver:
    image: ghcr.io/panadeo/cortex-next/services/document-parser-unoserver:${IMAGE_TAG:?ustaw IMAGE_TAG w .env — obrazy tego repo NIE MAJA tagu `latest`, patrz komentarz przy usludze migrate}
    container_name: document-parser-unoserver${ENVIRONMENT_TAG}
    restart: unless-stopped
    command: ["python3", "-m", "unoserver.server", "--interface", "0.0.0.0", "--port", "2003"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "unoserver"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512M

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-run_default}
    external: true

volumes:
  cortex_frontend_ai_tools_history:
  cortex_frontend_cowork_data:
  cortex_frontend_okna_czasowe_data:
  cortex_frontend_desk_data:
  # Jedyny wolumen z jawnym `name:`. Pozostałe rozdziela dziś WYŁĄCZNIE prefiks
  # nazwy projektu, czyli nazwa katalogu wdrożenia (/home/itsg/cortex-frontend
  # vs /home/itsg/cortex-frontend-uat) — ta sama ukryta zależność, przed którą
  # ostrzega nagłówek docker-compose.cortex-next.yml. Dla katalogu z bazą cena
  # pomyłki jest inna niż dla historii AI Tools: podpięcie pustego wolumenu
  # znaczy `migrate` na czystej bazie i utratę kont, ról i grantów. Dlatego
  # nazwa jest parametryzowana tym samym ${ENVIRONMENT_TAG} co kontenery —
  # a jeśli ktoś ten tag zgubi, kolizja container_name zatrzyma deploy
  # GŁOŚNO, zanim dwie instancje zdążą współdzielić jedną bazę.
  cortex_frontend_postgres_data:
    name: cortex-frontend-postgres-data${ENVIRONMENT_TAG}
